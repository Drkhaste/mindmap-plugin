<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانلودر وابستگی‌های محلی - Medical Course Plugin</title>
    <style>
        body { font-family: Tahoma, sans-serif; line-height: 1.6; padding: 20px; max-width: 800px; margin: 0 auto; background-color: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #0f766e; }
        .btn { display: inline-block; background: #0f766e; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; cursor: pointer; border: none; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .progress-box { margin-top: 20px; padding: 10px; border: 1px solid #ddd; display: none; }
        ul { padding-right: 20px; }
        .status { font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
    <div class="card">
        <h1>دانلودر وابستگی‌ها</h1>
        <p>این ابزار تمام فایل‌های CSS، JS و فونت‌های مورد نیاز پلاگین را از CDN دانلود کرده و در یک فایل ZIP برای شما آماده می‌کند.</p>
        <p>فایل‌های دانلودی شامل:</p>
        <ul>
            <li>Font Awesome 6.5.1 (CSS & Webfonts)</li>
            <li>Select2 4.1.0-rc.0 (CSS & JS)</li>
        </ul>
        <button id="downloadBtn" class="btn">شروع دانلود و ساخت فایل ZIP</button>
        <div id="progressBox" class="progress-box">
            <div id="status" class="status">در حال آماده‌سازی...</div>
            <ul id="fileList"></ul>
        </div>
    </div>

    <script>
        const downloadBtn = document.getElementById('downloadBtn');
        const progressBox = document.getElementById('progressBox');
        const statusDiv = document.getElementById('status');
        const fileList = document.getElementById('fileList');

        const assets = [
            { url: 'https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css', path: 'fontawesome/css/all.min.css' },
            { url: 'https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/webfonts/fa-brands-400.ttf', path: 'fontawesome/webfonts/fa-brands-400.ttf' },
            { url: 'https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/webfonts/fa-brands-400.woff2', path: 'fontawesome/webfonts/fa-brands-400.woff2' },
            { url: 'https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/webfonts/fa-regular-400.ttf', path: 'fontawesome/webfonts/fa-regular-400.ttf' },
            { url: 'https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/webfonts/fa-regular-400.woff2', path: 'fontawesome/webfonts/fa-regular-400.woff2' },
            { url: 'https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/webfonts/fa-solid-900.ttf', path: 'fontawesome/webfonts/fa-solid-900.ttf' },
            { url: 'https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/webfonts/fa-solid-900.woff2', path: 'fontawesome/webfonts/fa-solid-900.woff2' },
            { url: 'https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/webfonts/fa-v4compatibility.ttf', path: 'fontawesome/webfonts/fa-v4compatibility.ttf' },
            { url: 'https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/webfonts/fa-v4compatibility.woff2', path: 'fontawesome/webfonts/fa-v4compatibility.woff2' },
            { url: 'https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css', path: 'select2/css/select2.min.css' },
            { url: 'https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js', path: 'select2/js/select2.min.js' }
        ];

        downloadBtn.addEventListener('click', async () => {
            downloadBtn.disabled = true;
            progressBox.style.display = 'block';
            const zip = new JSZip();

            for (const asset of assets) {
                try {
                    statusDiv.innerText = `در حال دانلود: ${asset.path}`;
                    const response = await fetch(asset.url);
                    if (!response.ok) throw new Error(`خطا در دانلود ${asset.url}`);
                    const blob = await response.blob();
                    zip.file(asset.path, blob);

                    const li = document.createElement('li');
                    li.innerText = `✓ ${asset.path}`;
                    fileList.appendChild(li);
                } catch (error) {
                    const li = document.createElement('li');
                    li.innerText = `✗ خطا در دانلود ${asset.path}: ${error.message}`;
                    li.style.color = 'red';
                    fileList.appendChild(li);
                }
            }

            statusDiv.innerText = 'در حال ساخت فایل ZIP...';
            const content = await zip.generateAsync({ type: 'blob' });
            saveAs(content, 'mcp-dependencies.zip');
            statusDiv.innerText = 'فایل با موفقیت ساخته و دانلود شد.';
            downloadBtn.disabled = false;
        });
    </script>
</body>
</html>
